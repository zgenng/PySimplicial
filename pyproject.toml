[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pysimplicial"
version = "0.2.0"
description = "Finite simplicial complexes, contiguity and simplicial LS category"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]
plot3d = ["plotly>=5"]
viz = ["matplotlib>=3.6", "plotly>=5"]
cuda12 = ["numba-cuda[cu12]"]
cuda13 = ["numba-cuda[cu13]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pysimplicial.datasets" = ["*.json"]

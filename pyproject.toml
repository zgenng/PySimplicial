[project.urls]
Homepage = "https://github.com/zgenng/PySimplicial"
Repository = "https://github.com/zgenng/PySimplicial"
Issues = "https://github.com/zgenng/PySimplicial/issues"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pysimplicial"
version = "0.2.0"
description = "Finite simplicial complexes, contiguity and simplicial LS category"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]
plot3d = ["plotly>=5"]
viz = ["matplotlib>=3.6", "plotly>=5"]
cuda12 = ["numba-cuda[cu12]"]
cuda13 = ["numba-cuda[cu13]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pysimplicial.datasets" = ["*.json"]
